<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><link rel="manifest" href="/manifest.webmanifest"><title>ねーさん生活アルバム</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ee;color:#191919;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 48px}header{padding:8px 4px 18px}h1{font-size:27px;margin:0 0 5px}.sub{color:#777;font-size:14px}.panel,.card{background:#fff;border-radius:18px;padding:15px;margin:11px 0;box-shadow:0 3px 18px rgba(0,0,0,.06)}textarea,input{width:100%;border:1px solid #ddd;border-radius:13px;padding:13px;font-size:16px;background:#fff}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#171717;color:#fff}.ghost{background:#eee}.danger{background:#f4dddd}.row{display:flex;gap:8px;margin-top:9px}.row>*{flex:1}.toolbar{display:flex;gap:8px;align-items:center}.count{font-size:13px;color:#777;margin-left:auto}.day{font-size:13px;font-weight:800;margin:18px 4px 7px;color:#666}.meta{font-size:12px;color:#888}.card h3{font-size:17px;margin:6px 0}.card p{margin:0;line-height:1.55;white-space:pre-wrap}.tags{margin-top:8px}.tag{display:inline-block;padding:4px 9px;border-radius:999px;background:#f0e7dc;font-size:12px;margin:3px}.actions{display:flex;justify-content:flex-end;margin-top:9px}.mini{font-size:12px;padding:7px 9px}.empty{text-align:center;color:#888;padding:28px 10px}.status{font-size:12px;color:#777;margin-top:8px;min-height:16px}.install{display:none}.hint{font-size:12px;color:#777;line-height:1.5;margin-top:8px}
</style></head><body><main><header><h1>📖 ねーさん生活アルバム</h1><div class="sub">喋った毎日を、思い出として残す。</div></header>
<section class="panel"><textarea id="text" placeholder="例：今日はふくちゃんと朝さんぽして、サウナ行って、昼寝した。"></textarea><div class="row"><button class="primary" onclick="record()">会話から記録</button><button class="ghost" onclick="load()">更新</button></div><div id="status" class="status"></div><div class="hint">ここは手入力用。ChatGPT側とMCP連携すると、ねーさんからこのアルバムを検索・記録できるようになる。</div></section>
<section class="panel"><div class="toolbar"><input id="q" placeholder="思い出を検索（ふくちゃん、サウナ…）" oninput="load()"><span id="count" class="count"></span></div><div class="row"><button class="ghost" onclick="exportData()">バックアップ</button><button class="ghost" onclick="importData()">復元</button><button class="danger" onclick="clearAll()">全部消去</button></div><input id="file" type="file" accept="application/json" hidden onchange="doImport(this)"></section>
<section id="list"></section></main><script>
const $=id=>document.getElementById(id);let timer;
async function record(){const text=$("text").value.trim();if(!text)return;$("status").textContent="整理中…";try{const r=await fetch('/api/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const j=await r.json();if(!r.ok)throw Error(j.error||'失敗');if(j.events?.length){const s=await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({events:j.events})});const z=await s.json();$("status").textContent=`${z.events?.length||0}件をアルバムに保存したで。`;}else $("status").textContent="記録する出来事は見つからんかったで。";$("text").value="";load()}catch(e){$("status").textContent="エラー："+e.message}}
async function load(){clearTimeout(timer);timer=setTimeout(async()=>{const q=encodeURIComponent($("q").value);const r=await fetch('/api/events?q='+q);const xs=await r.json();$("count").textContent=xs.length?`${xs.length}件`:'';const groups={};xs.forEach(e=>{const d=new Date(e.occurred_at);const k=d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});(groups[k]??=[]).push(e)});const html=Object.entries(groups).map(([day,es])=>`<div class="day">${esc(day)}</div>`+es.map(e=>`<article class="card"><div class="meta">${new Date(e.occurred_at).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</div><h3>${esc(e.title)}</h3><p>${esc(e.detail)}</p><div class="tags">${(e.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="actions"><button class="mini danger" onclick="del('${e.id}')">削除</button></div></article>`).join('')).join('');$("list").innerHTML=html||'<div class="empty">まだ思い出がないで。</div>'},120)}
async function del(id){if(!confirm('この思い出を削除する？'))return;await fetch('/api/events/'+id,{method:'DELETE'});load()}
async function clearAll(){if(!confirm('全部の思い出を消すで。ほんまにええ？'))return;await fetch('/api/events',{method:'DELETE'});load()}
async function exportData(){const r=await fetch('/api/events');const xs=await r.json();const blob=new Blob([JSON.stringify({app:'ねーさん生活アルバム',version:2,exported_at:new Date().toISOString(),events:xs},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='neesan-life-album-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(){$("file").click()}
async function doImport(inp){const f=inp.files[0];if(!f)return;try{const x=JSON.parse(await f.text());const events=Array.isArray(x)?x:x.events;if(!Array.isArray(events))throw Error('バックアップ形式が違う');await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({events})});load();alert('復元したで。')}catch(e){alert('復元失敗：'+e.message)}inp.value=''}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();
</script></body></html>
